# Lab local de IDOR, nivel 09. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile
      args:
        LEVEL: "09"
    image: cdelunasec-labs/idor:09
    container_name: idor-09
    ports:
      - "127.0.0.1:8309:80"
    volumes:
      - ../../.flags/idor:/lab-hashes
