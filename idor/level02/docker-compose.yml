# Lab local de IDOR, nivel 02. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile
      args:
        LEVEL: "02"
    image: cdelunasec-labs/idor:02
    container_name: idor-02
    ports:
      - "127.0.0.1:8302:80"
    volumes:
      - ../../.flags/idor:/lab-hashes
