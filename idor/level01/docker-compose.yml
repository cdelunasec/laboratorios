# Lab local de IDOR, nivel 01. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile
      args:
        LEVEL: "01"
    image: cdelunasec-labs/idor:01
    container_name: idor-01
    ports:
      - "127.0.0.1:8301:80"
    volumes:
      - ../../.flags/idor:/lab-hashes
