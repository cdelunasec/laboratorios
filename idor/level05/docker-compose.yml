# Lab local de IDOR, nivel 05. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile
      args:
        LEVEL: "05"
    image: cdelunasec-labs/idor:05
    container_name: idor-05
    ports:
      - "127.0.0.1:8305:80"
    volumes:
      - ../../.flags/idor:/lab-hashes
