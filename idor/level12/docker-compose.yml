# Lab local de IDOR, nivel 12. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile
      args:
        LEVEL: "12"
    image: cdelunasec-labs/idor:12
    container_name: idor-12
    ports:
      - "127.0.0.1:8312:80"
    volumes:
      - ../../.flags/idor:/lab-hashes
