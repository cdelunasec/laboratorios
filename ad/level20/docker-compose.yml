services:
  dc:
    build:
      context: ..
      dockerfile: common/dc/Dockerfile
      args:
        LEVEL: "20"
    image: cdelunasec-labs/ad-dc:20
    container_name: ad-20-dc
    hostname: dc01
    domainname: quisqueya.lab
    dns: [127.0.0.1]
    environment:
      LAB_FLAG_ON: dc
    networks:
      lab:
        ipv4_address: 10.13.37.10
    volumes:
      - ../../.flags/ad:/lab-hashes
      - labjoin:/lab-join
  srv:
    build:
      context: ..
      dockerfile: common/srv/Dockerfile
      args:
        LEVEL: "20"
    image: cdelunasec-labs/ad-srv:20
    container_name: ad-20-srv
    hostname: srv01
    domainname: quisqueya.lab
    dns: [10.13.37.10]
    depends_on:
      - dc
    networks:
      lab:
        ipv4_address: 10.13.37.20
    volumes:
      - labjoin:/lab-join
networks:
  lab:
    ipam:
      config:
        - subnet: 10.13.37.0/24
volumes:
  labjoin:
