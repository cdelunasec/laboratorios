# Lab local de XSS, nivel 07. Solo escucha en 127.0.0.1 (entorno controlado).
# Se une a la red labs-bot para que el bot (el admin) lo vea como xss-07.labs.test.
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "07"
    image: cdelunasec-labs/xss:07
    container_name: xss-07
    ports:
      - "127.0.0.1:8507:80"
    networks:
      default: {}
      labs:
        aliases:
          - xss-07.labs.test
    volumes:
      - ../../.flags/xss:/lab-hashes

networks:
  labs:
    external: true
    name: labs-bot
