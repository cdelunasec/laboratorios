# Lab local de CSRF, nivel 12. Solo escucha en 127.0.0.1 (entorno controlado).
# Se une a la red labs-bot para que el bot (el admin) lo vea como csrf-12.labs.test.
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "12"
    image: cdelunasec-labs/csrf:12
    container_name: csrf-12
    ports:
      - "127.0.0.1:8612:80"
    networks:
      default: {}
      labs:
        aliases:
          - csrf-12.labs.test
    volumes:
      - ../../.flags/csrf:/lab-hashes

networks:
  labs:
    external: true
    name: labs-bot
