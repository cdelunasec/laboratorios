# Lab local de CSRF, nivel 03. Solo escucha en 127.0.0.1 (entorno controlado).
# Se une a la red labs-bot para que el bot (el admin) lo vea como csrf-03.labs.test.
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "03"
    image: cdelunasec-labs/csrf:03
    container_name: csrf-03
    ports:
      - "127.0.0.1:8603:80"
    networks:
      default: {}
      labs:
        aliases:
          - csrf-03.labs.test
    volumes:
      - ../../.flags/csrf:/lab-hashes

networks:
  labs:
    external: true
    name: labs-bot
