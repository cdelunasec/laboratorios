# Lab local de cabeceras HTTP, nivel 17. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "17"
    image: cdelunasec-labs/http-headers:17
    container_name: http-headers-17
    ports:
      - "127.0.0.1:8217:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/http-headers:/lab-hashes
