<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

DirectoryIndex index.php index.html

<Directory /var/www/>
    Options -Indexes
    AllowOverride None
</Directory>

# Sitio público (también es el vhost por defecto: cualquier Host desconocido cae aquí).
<VirtualHost *:80>
    ServerName panaderialamejor.local
    DocumentRoot /var/www/html
</VirtualHost>

# Sitio interno de los empleados, en el mismo servidor.
<VirtualHost *:80>
    ServerName intranet.panaderialamejor.local
    DocumentRoot /var/www/intranet
</VirtualHost>
