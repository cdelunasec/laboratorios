# Lab local de cabeceras HTTP, nivel 07. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "07"
    image: cdelunasec-labs/http-headers:07
    container_name: http-headers-07
    ports:
      - "127.0.0.1:8207:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/http-headers:/lab-hashes
