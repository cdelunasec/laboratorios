# Lab local de cabeceras HTTP, nivel 09. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "09"
    image: cdelunasec-labs/http-headers:09
    container_name: http-headers-09
    ports:
      - "127.0.0.1:8209:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/http-headers:/lab-hashes
