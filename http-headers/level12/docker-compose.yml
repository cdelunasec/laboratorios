# Lab local de cabeceras HTTP, nivel 12. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "12"
    image: cdelunasec-labs/http-headers:12
    container_name: http-headers-12
    ports:
      - "127.0.0.1:8212:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/http-headers:/lab-hashes
