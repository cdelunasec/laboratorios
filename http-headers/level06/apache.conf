<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

DirectoryIndex index.php index.html

<Directory /var/www/>
    Options -Indexes
    AllowOverride None
</Directory>

# El "WAF": fuera de GET y POST, nada llega a la aplicación.
<Directory /var/www/html>
    <LimitExcept GET POST>
        Require all denied
    </LimitExcept>
</Directory>
