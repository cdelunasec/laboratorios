# Lab local de cabeceras HTTP, nivel 06. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "06"
    image: cdelunasec-labs/http-headers:06
    container_name: http-headers-06
    ports:
      - "127.0.0.1:8206:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/http-headers:/lab-hashes
