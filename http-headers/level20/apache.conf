<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

DirectoryIndex index.php index.html

<Directory /var/www/>
    Options -Indexes
    AllowOverride None
</Directory>

# Página pública de estado (vhost por defecto).
<VirtualHost *:80>
    ServerName estado.redcaribe.local
    DocumentRoot /var/www/html
</VirtualHost>

# Consola de operaciones, en el mismo servidor.
<VirtualHost *:80>
    ServerName ops.redcaribe.local
    DocumentRoot /var/www/ops
</VirtualHost>
