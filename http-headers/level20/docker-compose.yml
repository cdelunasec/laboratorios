# Lab local de cabeceras HTTP, nivel 20. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "20"
    image: cdelunasec-labs/http-headers:20
    container_name: http-headers-20
    ports:
      - "127.0.0.1:8220:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/http-headers:/lab-hashes
