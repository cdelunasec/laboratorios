# Lab local de cabeceras HTTP, nivel 08. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "08"
    image: cdelunasec-labs/http-headers:08
    container_name: http-headers-08
    ports:
      - "127.0.0.1:8208:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/http-headers:/lab-hashes
