# Lab local de cabeceras HTTP, nivel 03. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "03"
    image: cdelunasec-labs/http-headers:03
    container_name: http-headers-03
    ports:
      - "127.0.0.1:8203:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/http-headers:/lab-hashes
