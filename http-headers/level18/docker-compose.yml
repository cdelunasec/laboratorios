# Lab local de cabeceras HTTP, nivel 18. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "18"
    image: cdelunasec-labs/http-headers:18
    container_name: http-headers-18
    ports:
      - "127.0.0.1:8218:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/http-headers:/lab-hashes
