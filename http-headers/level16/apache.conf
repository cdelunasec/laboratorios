<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

DirectoryIndex index.php index.html

<Directory /var/www/>
    Options -Indexes
    AllowOverride None
</Directory>

# Sitio público (vhost por defecto).
<VirtualHost *:80>
    ServerName tiendamarisol.local
    DocumentRoot /var/www/html
</VirtualHost>

# API de staging: mismo servidor, otro nombre.
<VirtualHost *:80>
    ServerName staging-api.tiendamarisol.local
    DocumentRoot /var/www/staging
</VirtualHost>
