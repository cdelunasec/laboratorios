# Lab local de cabeceras HTTP, nivel 16. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "16"
    image: cdelunasec-labs/http-headers:16
    container_name: http-headers-16
    ports:
      - "127.0.0.1:8216:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/http-headers:/lab-hashes
