# Lab local de cabeceras HTTP, nivel 15. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "15"
    image: cdelunasec-labs/http-headers:15
    container_name: http-headers-15
    ports:
      - "127.0.0.1:8215:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/http-headers:/lab-hashes
