# Lab local de cabeceras HTTP, nivel 10. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "10"
    image: cdelunasec-labs/http-headers:10
    container_name: http-headers-10
    ports:
      - "127.0.0.1:8210:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/http-headers:/lab-hashes
