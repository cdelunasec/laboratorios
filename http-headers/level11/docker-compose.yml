# Lab local de cabeceras HTTP, nivel 11. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "11"
    image: cdelunasec-labs/http-headers:11
    container_name: http-headers-11
    ports:
      - "127.0.0.1:8211:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/http-headers:/lab-hashes
