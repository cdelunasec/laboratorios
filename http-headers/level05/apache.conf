<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

DirectoryIndex index.php index.html

<Directory /var/www/>
    Options -Indexes
    AllowOverride None
</Directory>

# "Protección" del panel: alguien la copió de un tutorial viejo.
<Directory /var/www/html/admin>
    <Limit GET POST>
        Require ip 10.0.0.0/8
    </Limit>
</Directory>
