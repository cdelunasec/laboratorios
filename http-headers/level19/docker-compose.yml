# Lab local de cabeceras HTTP, nivel 19. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "19"
    image: cdelunasec-labs/http-headers:19
    container_name: http-headers-19
    ports:
      - "127.0.0.1:8219:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/http-headers:/lab-hashes
