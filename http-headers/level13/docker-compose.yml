# Lab local de cabeceras HTTP, nivel 13. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "13"
    image: cdelunasec-labs/http-headers:13
    container_name: http-headers-13
    ports:
      - "127.0.0.1:8213:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/http-headers:/lab-hashes
