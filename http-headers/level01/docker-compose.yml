# Lab local de cabeceras HTTP, nivel 01. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "01"
    image: cdelunasec-labs/http-headers:01
    container_name: http-headers-01
    ports:
      - "127.0.0.1:8201:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/http-headers:/lab-hashes
