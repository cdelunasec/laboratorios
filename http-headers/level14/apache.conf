<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

DirectoryIndex index.php index.html

<Directory /var/www/>
    Options -Indexes
    AllowOverride None
</Directory>

# Todas las rutas pasan por el front controller.
<Directory /var/www/html>
    FallbackResource /index.php
</Directory>

# El panel se bloquea en el servidor web, antes de llegar a la app.
<Location "/admin">
    Require all denied
</Location>
