# Lab local de aplicaciones web completas, nivel 01. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "01"
    image: cdelunasec-labs/web:01
    container_name: web-01
    ports:
      - "127.0.0.1:8701:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/web:/lab-hashes
