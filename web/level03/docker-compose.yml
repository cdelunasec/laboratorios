# Lab local de aplicaciones web completas, nivel 03. Solo escucha en 127.0.0.1 (entorno controlado).
# Se une a la red labs-bot para que el bot lo vea como web-03.labs.test.
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "03"
    image: cdelunasec-labs/web:03
    container_name: web-03
    ports:
      - "127.0.0.1:8703:80"
    networks:
      default: {}
      labs:
        aliases:
          - web-03.labs.test
    volumes:
      - ../../.flags/web:/lab-hashes

networks:
  labs:
    external: true
    name: labs-bot
