<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

DirectoryIndex index.php index.html

<Directory /var/www/>
    Options -Indexes
    AllowOverride None
</Directory>

# Las portadas son imágenes: aquí no corre PHP.
<Directory /var/www/html/uploads>
    php_admin_flag engine off
    <FilesMatch "\.php$">
        SetHandler none
    </FilesMatch>
</Directory>
