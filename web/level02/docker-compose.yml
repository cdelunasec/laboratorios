# Lab local de aplicaciones web completas, nivel 02. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "02"
    image: cdelunasec-labs/web:02
    container_name: web-02
    ports:
      - "127.0.0.1:8702:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/web:/lab-hashes
