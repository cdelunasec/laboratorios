# Lab local de SSRF, nivel 09. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "09"
    image: cdelunasec-labs/ssrf:09
    container_name: ssrf-09
    ports:
      - "127.0.0.1:8409:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "metadata.nube.local:127.0.0.1"
    volumes:
      - ../../.flags/ssrf:/lab-hashes
