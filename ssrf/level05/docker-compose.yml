# Lab local de SSRF, nivel 05. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "05"
    image: cdelunasec-labs/ssrf:05
    container_name: ssrf-05
    ports:
      - "127.0.0.1:8405:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/ssrf:/lab-hashes
