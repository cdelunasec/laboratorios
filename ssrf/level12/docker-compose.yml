# Lab local de SSRF, nivel 12. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "12"
    image: cdelunasec-labs/ssrf:12
    container_name: ssrf-12
    ports:
      - "127.0.0.1:8412:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "metadata.nube.local:127.0.0.1"
      - "tienda.local:127.0.0.1"
    volumes:
      - ../../.flags/ssrf:/lab-hashes
