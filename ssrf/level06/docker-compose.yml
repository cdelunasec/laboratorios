# Lab local de SSRF, nivel 06. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "06"
    image: cdelunasec-labs/ssrf:06
    container_name: ssrf-06
    ports:
      - "127.0.0.1:8406:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/ssrf:/lab-hashes
