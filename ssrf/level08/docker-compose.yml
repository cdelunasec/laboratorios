# Lab local de SSRF, nivel 08. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "08"
    image: cdelunasec-labs/ssrf:08
    container_name: ssrf-08
    ports:
      - "127.0.0.1:8408:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/ssrf:/lab-hashes
