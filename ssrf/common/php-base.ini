; Lab local de SSRF (entorno controlado). Errores visibles a propósito:
; ayudan a entender qué está haciendo la app con lo que le mandas.
display_errors = On
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED
expose_php = Off
allow_url_fopen = On
allow_url_include = Off
register_argc_argv = Off
file_uploads = Off
