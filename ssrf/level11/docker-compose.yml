# Lab local de SSRF, nivel 11. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "11"
    image: cdelunasec-labs/ssrf:11
    container_name: ssrf-11
    ports:
      - "127.0.0.1:8411:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/ssrf:/lab-hashes
