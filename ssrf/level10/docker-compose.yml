# Lab local de SSRF, nivel 10. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "10"
    image: cdelunasec-labs/ssrf:10
    container_name: ssrf-10
    ports:
      - "127.0.0.1:8410:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "interno.corp:127.0.0.1"
    volumes:
      - ../../.flags/ssrf:/lab-hashes
