# Lab local de SSRF, nivel 04. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "04"
    image: cdelunasec-labs/ssrf:04
    container_name: ssrf-04
    ports:
      - "127.0.0.1:8404:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/ssrf:/lab-hashes
