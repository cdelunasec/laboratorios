# Lab local de SSRF, nivel 03. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "03"
    image: cdelunasec-labs/ssrf:03
    container_name: ssrf-03
    ports:
      - "127.0.0.1:8403:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.flags/ssrf:/lab-hashes
