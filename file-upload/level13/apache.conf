<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

DirectoryIndex index.php index.html

<Directory /var/www/>
    Options -Indexes
    AllowOverride None
</Directory>

# Los archivos subidos nunca se ejecutan
<Directory /var/www/html/uploads>
    php_admin_flag engine off
</Directory>
