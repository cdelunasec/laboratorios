# Lab local de LFI, nivel 08. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "08"
    image: cdelunasec-labs/lfi:08
    container_name: lfi-08
    ports:
      - "127.0.0.1:8108:80"
    volumes:
      - ../../.flags/lfi:/lab-hashes
