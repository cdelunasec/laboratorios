# Lab local de LFI, nivel 02. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "02"
    image: cdelunasec-labs/lfi:02
    container_name: lfi-02
    ports:
      - "127.0.0.1:8102:80"
    volumes:
      - ../../.flags/lfi:/lab-hashes
