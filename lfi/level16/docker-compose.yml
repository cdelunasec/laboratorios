# Lab local de LFI, nivel 16. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "16"
    image: cdelunasec-labs/lfi:16
    container_name: lfi-16
    ports:
      - "127.0.0.1:8116:80"
    volumes:
      - ../../.flags/lfi:/lab-hashes
