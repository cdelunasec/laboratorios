# Lab local de LFI, nivel 06. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "06"
    image: cdelunasec-labs/lfi:06
    container_name: lfi-06
    ports:
      - "127.0.0.1:8106:80"
    volumes:
      - ../../.flags/lfi:/lab-hashes
