# Lab local de LFI, nivel 17. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "17"
    image: cdelunasec-labs/lfi:17
    container_name: lfi-17
    ports:
      - "127.0.0.1:8117:80"
    volumes:
      - ../../.flags/lfi:/lab-hashes
