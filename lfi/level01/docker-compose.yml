# Lab local de LFI, nivel 01. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "01"
    image: cdelunasec-labs/lfi:01
    container_name: lfi-01
    ports:
      - "127.0.0.1:8101:80"
    volumes:
      - ../../.flags/lfi:/lab-hashes
