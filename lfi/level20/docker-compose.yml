# Lab local de LFI, nivel 20. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "20"
    image: cdelunasec-labs/lfi:20
    container_name: lfi-20
    ports:
      - "127.0.0.1:8120:80"
    volumes:
      - ../../.flags/lfi:/lab-hashes
