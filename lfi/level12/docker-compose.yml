# Lab local de LFI, nivel 12. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "12"
    image: cdelunasec-labs/lfi:12
    container_name: lfi-12
    ports:
      - "127.0.0.1:8112:80"
    volumes:
      - ../../.flags/lfi:/lab-hashes
