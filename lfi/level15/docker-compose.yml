# Lab local de LFI, nivel 15. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "15"
    image: cdelunasec-labs/lfi:15
    container_name: lfi-15
    ports:
      - "127.0.0.1:8115:80"
    volumes:
      - ../../.flags/lfi:/lab-hashes
