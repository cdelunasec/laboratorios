# Lab local de LFI, nivel 19. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "19"
    image: cdelunasec-labs/lfi:19
    container_name: lfi-19
    ports:
      - "127.0.0.1:8119:80"
    volumes:
      - ../../.flags/lfi:/lab-hashes
