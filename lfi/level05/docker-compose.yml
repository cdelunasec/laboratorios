# Lab local de LFI, nivel 05. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "05"
    image: cdelunasec-labs/lfi:05
    container_name: lfi-05
    ports:
      - "127.0.0.1:8105:80"
    volumes:
      - ../../.flags/lfi:/lab-hashes
