# Lab local de LFI, nivel 10. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "10"
    image: cdelunasec-labs/lfi:10
    container_name: lfi-10
    ports:
      - "127.0.0.1:8110:80"
    volumes:
      - ../../.flags/lfi:/lab-hashes
