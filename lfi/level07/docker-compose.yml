# Lab local de LFI, nivel 07. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "07"
    image: cdelunasec-labs/lfi:07
    container_name: lfi-07
    ports:
      - "127.0.0.1:8107:80"
    volumes:
      - ../../.flags/lfi:/lab-hashes
