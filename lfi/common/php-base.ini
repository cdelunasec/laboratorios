; Lab local de LFI (entorno controlado). Errores visibles a propósito: ayudan a
; entender qué ruta está incluyendo la app.
display_errors = On
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED
allow_url_fopen = On
allow_url_include = Off
; Off para que el truco de pearcmd.php no se salte la técnica de cada nivel.
register_argc_argv = Off
file_uploads = On
upload_max_filesize = 2M
post_max_size = 4M
