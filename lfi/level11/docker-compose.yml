# Lab local de LFI, nivel 11. Solo escucha en 127.0.0.1 (entorno controlado).
services:
  web:
    build:
      context: ..
      dockerfile: common/Dockerfile.apache
      args:
        LEVEL: "11"
    image: cdelunasec-labs/lfi:11
    container_name: lfi-11
    ports:
      - "127.0.0.1:8111:80"
    volumes:
      - ../../.flags/lfi:/lab-hashes
